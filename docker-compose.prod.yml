# Production stack for a server (VPS): PostgreSQL + the app + Caddy (automatic HTTPS).
# Step-by-step guide: docs/DEPLOY-ONLINE.md
#
#   cp deploy/env.production.example .env     # then edit it
#   docker compose -f docker-compose.prod.yml up -d --build
#   docker compose -f docker-compose.prod.yml --profile tools run --rm tools   # first-time data (roles, categories, first admin)
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-civic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-civicreport}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 20
    # No "ports:" on purpose – the database is not reachable from the internet.

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-civic}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-civicreport}?schema=public
      UPLOAD_DIR: /app/storage/uploads
    volumes:
      - uploads:/app/storage/uploads
    expose: ["3000"]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [app]
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  # One-off helper (not started by "up"): installs dependencies and runs the seed.
  #   docker compose -f docker-compose.prod.yml --profile tools run --rm tools
  #   docker compose -f docker-compose.prod.yml --profile tools run --rm tools npm run db:relocate-demo
  tools:
    image: node:22
    profiles: ["tools"]
    working_dir: /app
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-civic}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-civicreport}?schema=public
      UPLOAD_DIR: /app/storage/uploads
    depends_on:
      db: { condition: service_healthy }
    volumes:
      - .:/app
      - tools_node_modules:/app/node_modules
      - uploads:/app/storage/uploads
    entrypoint: ["sh", "-c", "npm ci --no-audit --no-fund --loglevel=error && exec \"$$@\"", "--"]
    command: ["npm", "run", "db:seed"]

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:
  tools_node_modules:
